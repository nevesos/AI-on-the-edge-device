name: Release ESP32-S3 CAM

on:
  push:
    tags:
      - "esp32s3_cam-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set variables
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "release_name=${GITHUB_REF_NAME:-manual-${GITHUB_RUN_NUMBER}}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
            code/.pio
          key: esp32s3-cam-${{ runner.os }}-${{ hashFiles('code/platformio.ini', 'code/sdkconfig*.defaults', 'code/sdkconfig.esp32s3_cam') }}
          restore-keys: |
            esp32s3-cam-${{ runner.os }}-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build ESP32-S3 CAM firmware
        working-directory: code
        run: platformio run --environment esp32s3_cam

      - name: Prepare release files
        run: |
          mkdir -p release
          cp code/.pio/build/esp32s3_cam/firmware.bin release/firmware_esp32s3_cam.bin
          cp code/.pio/build/esp32s3_cam/bootloader.bin release/bootloader_esp32s3_cam.bin
          cp code/.pio/build/esp32s3_cam/partitions.bin release/partitions_esp32s3_cam.bin
          cp code/.pio/build/esp32s3_cam/firmware.elf release/firmware_esp32s3_cam.elf
          {
            echo "release=${{ steps.vars.outputs.release_name }}"
            echo "commit=${{ github.sha }}"
            echo "commit_short=${{ steps.vars.outputs.sha_short }}"
            echo "environment=esp32s3_cam"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > release/build-info.txt
          sha256sum release/* > release/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3_cam_${{ steps.vars.outputs.sha_short }}
          path: release/*

      - name: Create GitHub release for tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: release/*
